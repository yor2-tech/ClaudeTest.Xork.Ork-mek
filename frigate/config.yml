# Frigate-Konfiguration – Doku: https://docs.frigate.video/configuration/
# Platzhalter {FRIGATE_...} kommen aus der .env-Datei.
# IP-Adressen und Stream-Pfade unten an eure Kameras anpassen
# (Beispiel = Reolink; andere Marken haben andere Pfade).

mqtt:
  enabled: true
  host: mosquitto
  user: "{FRIGATE_MQTT_USER}"
  password: "{FRIGATE_MQTT_PASSWORD}"

# Personenerkennung über die Grafikeinheit des Intel-Mini-PCs (N100 o. ä.)
detectors:
  ov:
    type: openvino
    device: GPU

model:
  width: 300
  height: 300
  input_tensor: nhwc
  input_pixel_format: bgr
  path: /openvino-model/ssdlite_mobilenet_v2.xml
  labelmap_path: /openvino-model/coco_91cl_bkgr.txt

# Kamerastreams: "main" = volle Auflösung (Aufnahme), "sub" = klein (Erkennung)
go2rtc:
  streams:
    einfahrt:
      - rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@192.168.178.51:554/h264Preview_01_main
    einfahrt_sub:
      - rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@192.168.178.51:554/h264Preview_01_sub
    garten:
      - rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@192.168.178.52:554/h264Preview_01_main
    garten_sub:
      - rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@192.168.178.52:554/h264Preview_01_sub

# Gilt für alle Kameras
objects:
  track: [person]
  filters:
    person:
      min_score: 0.5
      threshold: 0.7

snapshots:
  enabled: true
  bounding_box: true
  retain:
    default: 30

record:
  enabled: true
  alerts:
    retain:
      days: 30
  detections:
    retain:
      days: 14

cameras:
  einfahrt:
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/einfahrt
          input_args: preset-rtsp-restream
          roles: [record]
        - path: rtsp://127.0.0.1:8554/einfahrt_sub
          input_args: preset-rtsp-restream
          roles: [detect]
    detect:
      width: 640
      height: 360
      fps: 5
    # Zone = euer Grundstück im Bild. Am einfachsten in der Frigate-Oberfläche
    # einzeichnen (Einstellungen > Masken & Zonen) und die Koordinaten hier ersetzen.
    # Gehweg/Straße NICHT in die Zone aufnehmen – dort gibt es dann keinen Alarm.
    zones:
      grundstueck:
        coordinates: 0.05,0.95,0.95,0.95,0.95,0.45,0.05,0.45
        objects: [person]
        inertia: 3
    review:
      alerts:
        required_zones: [grundstueck]

  garten:
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/garten
          input_args: preset-rtsp-restream
          roles: [record]
        - path: rtsp://127.0.0.1:8554/garten_sub
          input_args: preset-rtsp-restream
          roles: [detect]
    detect:
      width: 640
      height: 360
      fps: 5
    zones:
      grundstueck:
        coordinates: 0,1,1,1,1,0,0,0
        objects: [person]
        inertia: 3
    review:
      alerts:
        required_zones: [grundstueck]
